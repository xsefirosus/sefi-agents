# sefi-weekly-retro-opencode -- the weekly-retro loop on OpenCode, against this repo.
#
# Scheduled Monday at 07:00 UTC. The Claude-based retro.yml remains available for manual
# dispatch; keeping the cron in this workflow prevents duplicate runners over the same
# loop and state files.
#
# DEFAULT MODEL -- overridable per dispatch via the model input; CI-only exception to
# config/model-map.yml. The shipped default, opencode/deepseek-v4.1-flash-free, is listed
# by `opencode models` with zero input, output, and cache cost (verified 2026-11-21 on
# opencode-ai 1.19.6). Its predecessor, opencode/muse-spark-1.3-contributor-free, rotated
# out of the catalog. Auto-picking whatever-is-free is deliberately NOT done: the live
# catalog mixes non-agent models (TTS/video/embeddings/music) into what `opencode models`
# lists, and an unverified silent substitution is against this repo's discipline.
# model-map.yml itself is deliberately untouched and stays flexible on every tier (the
# free catalog rotates; see that file's own header). If the default rotates out, pass
# another id at dispatch time or update the default here; a preflight step checks the id
# against `opencode models` before any model call.
#
# PRIVACY CAVEAT (model chosen at dispatch): submitted data may train the upstream
# provider's models depending on the chosen model's own terms. These workflows must only
# ever operate on this already-public repo's own content -- never repoint them at
# proprietary code.
#
# improvement.enabled is false in config/sefi.config.yml, deliberately (commands/init.md's
# shared-install guardrail). This loop therefore writes PROPOSALS to
# state/retro-<date>.md, never applies an edit itself -- a human reviews the proposal and
# flips the flag or applies it by hand. That is unchanged by this workflow existing.
name: sefi-weekly-retro-opencode

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Any provider/model id listed by 'opencode models'. Default is the zero-cost DeepSeek V4.1 Flash Free model."
        type: string
        default: opencode/deepseek-v4.1-flash-free
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # Gates scheduled and manually dispatched OpenCode retro runs.
  group: sefi-maintenance
  cancel-in-progress: false

jobs:
  retro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Discovery reads state/metrics.md and the retro ledger history
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Probe declared tools before the loop runs
        # requires-tools: git, rg. rg drives the scorecard scan in Discovery; without it
        # the retro reports UNKNOWN rather than an empty finding set.
        continue-on-error: true
        run: bash plugins/sefi-core/scripts/probe-tools.sh --loop loops/weekly-retro.loop.md

      - name: Install the headless agent CLI
        run: npm install -g opencode-ai

      - name: Write the Zen credential into the OpenCode auth file
        # No CLI/env-var contract for the Zen API key could be verified from primary
        # sources (state/plan-opencode-workflows.md step 3), so the credential is written
        # to OpenCode's own data dir at runtime instead. Path and JSON shape verified via
        # `opencode auth list` + `opencode debug paths` on 2026-08-23.
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${OPENCODE_ZEN_API_KEY:-}" ] || {
            echo "OPENCODE_ZEN_API_KEY is not set. Add it under Settings > Secrets > Actions." >&2
            exit 1
          }
          mkdir -p "$HOME/.local/share/opencode"
          cat > "$HOME/.local/share/opencode/auth.json" <<EOF
          {"opencode":{"type":"api","key":"${OPENCODE_ZEN_API_KEY}"}}
          EOF

      - name: Verify OpenCode sees the credential
        # Fail fast, before any model call, if the auth file did not land. Match the
        # provider label, not a version-specific display name: opencode-ai 1.19.6 prints
        # "OpenCode", not the retired "OpenCode Zen".
        run: |
          set -euo pipefail
          if ! opencode auth list | grep -Eqi 'OpenCode[[:space:]].*(api|API key|stored)'; then
            echo "OpenCode did not list a credential written to auth.json:" >&2
            opencode auth list >&2 || true
            exit 1
          fi

      - name: Verify the selected model is available
        # The free catalog rotates. Fail here with the current free ids instead of
        # letting the loop fail mid-run on an unknown model.
        env:
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          MODEL="${MODEL:-opencode/deepseek-v4.1-flash-free}"
          if ! opencode models | grep -Fxq "$MODEL"; then
            echo "MODEL '$MODEL' is not listed by 'opencode models'." >&2
            echo "Free OpenCode models currently listed:" >&2
            opencode models | grep -E '^opencode/.*-free$' >&2 || true
            exit 1
          fi

      - name: Run the retro loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          # Prompt content matches retro.yml byte for byte. Transport differs: retro.yml
          # pipes via stdin (live-verified for the Claude CLI); the live-verified
          # non-interactive form for `opencode run` (plan step 2) takes the message as an
          # argument, so it is built here and passed quoted.
          PROMPT="$(cat <<'EOF'
          Run /sefi:retro against this repository.
          Follow loops/weekly-retro.loop.md exactly, including its human checkpoint.
          EOF
          )"
          MODEL="${MODEL:-opencode/deepseek-v4.1-flash-free}"
          case "$MODEL" in
            *[[:space:]]*|"") echo "MODEL must be a non-empty provider/model id (see opencode models)" >&2; exit 2 ;;
            */*) : ;;
            *) echo "MODEL must look like provider/model (see opencode models)" >&2; exit 2 ;;
          esac
          opencode run -m "$MODEL" --auto "$PROMPT"

      - name: Upload validated state candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: retro-state
          path: |
            state/
            memory/
            inbox/
          if-no-files-found: ignore

  publish:
    needs: retro
    if: ${{ needs.retro.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: retro-state
          path: .
      - uses: ./.github/actions/publish-state
        with:
          branch-prefix: retro
          commit-message: "chore(retro): weekly-retro cycle"
          title: "retro: weekly-retro cycle"
          body: "Automated weekly-retro cycle. Never auto-applied or auto-merged."
          bot-name: sefi-retro[bot]
          bot-email: sefi-retro[bot]@users.noreply.github.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
