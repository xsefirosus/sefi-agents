# sefi-weekly-retro -- the weekly-retro loop, running against this repo.
#
# MANUAL DISPATCH ONLY. The Monday weekly-retro schedule runs through
# retro-opencode.yml, keeping a single scheduled runner for this loop and its state files.
#
# improvement.enabled is false in config/sefi.config.yml, deliberately (commands/init.md's
# shared-install guardrail). This loop therefore writes PROPOSALS to
# state/retro-<date>.md, never applies an edit itself -- a human reviews the proposal and
# flips the flag or applies it by hand. That is unchanged by this workflow existing.
name: sefi-weekly-retro

on:
  workflow_dispatch:
    inputs:
      allow_unmeasured_spend:
        description: "Explicit interactive waiver when local usage telemetry is unavailable"
        type: boolean
        default: false
      estimated_run_usd:
        description: "Maximum USD expected for this provider run; the preflight blocks runs that cannot fit the cap."
        type: string
        default: "0.50"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: sefi-maintenance
  cancel-in-progress: false

jobs:
  retro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Discovery reads state/metrics.md and the retro ledger history
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Probe declared tools before the loop runs
        # requires-tools: git, rg. rg drives the scorecard scan in Discovery; without it
        # the retro reports UNKNOWN rather than an empty finding set.
        continue-on-error: true
        run: bash plugins/sefi-core/scripts/probe-tools.sh --loop loops/weekly-retro.loop.md

      - name: Install the headless agent CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Preflight budget
        uses: ./.github/actions/preflight-budget
        with:
          estimated-run-usd: ${{ inputs.estimated_run_usd || '0.50' }}
          allow-unmeasured-spend: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unmeasured_spend }}

      - name: Run the retro loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${ANTHROPIC_API_KEY:-}" ] || {
            echo "ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets > Actions." >&2
            exit 1
          }
          # Prompt via stdin, never an inline argument -- same Windows argument-length
          # rationale as triage.yml.
          {
            echo "Run /sefi:retro against this repository."
            echo "Follow loops/weekly-retro.loop.md exactly, including its human checkpoint."
          } | claude --print --dangerously-skip-permissions --add-dir "$PWD"

      - name: Enforce budget caps
        if: always()
        env:
          ALLOW_UNMEASURED_SPEND: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unmeasured_spend }}
        run: |
          set -euo pipefail
          bash plugins/sefi-core/scripts/budget-check.sh --scope run || status=$?
          if [ "${status:-0}" -eq 3 ] && [ "${ALLOW_UNMEASURED_SPEND:-false}" = "true" ]; then
            echo "budget-check: explicit interactive waiver accepted for this run" >&2
            exit 0
          fi
          exit "${status:-0}"

      - name: Upload validated state candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: retro-state
          path: |
            state/
            memory/
            inbox/
          if-no-files-found: ignore

  publish:
    needs: retro
    if: ${{ needs.retro.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: retro-state
          path: .
      - uses: ./.github/actions/publish-state
        with:
          branch-prefix: retro
          commit-message: "chore(retro): weekly-retro cycle"
          title: "retro: weekly-retro cycle"
          body: "Automated weekly-retro cycle. Never auto-applied or auto-merged."
          bot-name: sefi-retro[bot]
          bot-email: sefi-retro[bot]@users.noreply.github.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
