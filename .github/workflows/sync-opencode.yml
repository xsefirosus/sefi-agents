# sefi-sync-opencode -- the sync loop (dependency upkeep) on OpenCode, against this repo.
#
# MANUAL DISPATCH ONLY (workflow_dispatch, no schedule:) by design. The Claude-based
# sync.yml already runs on cron (Monday 08:00 UTC) as of the 2026-08-23 audit remediation;
# adding a second scheduled runner over the same loop and the same state/ files would
# multiply the untested-collision risk (docs/LOOP-FAILURE-MODES.md S3) rather than the
# coverage -- the acting_on lock is the only defense and has never run live even for the
# Claude-only case. Manual dispatch is a deliberate, smaller first step; enabling a
# schedule here is a separate future owner decision, not this file's to make.
#
# DEFAULT MODEL -- overridable per dispatch via the model input; CI-only exception to
# config/model-map.yml. The shipped default, opencode/muse-spark-1.2-contributor-free,
# was verified live on 2026-08-24 (listed by `opencode models`, -m invocation reached
# Zen). Auto-picking whatever-is-free is deliberately NOT done: the live catalog mixes
# non-agent models (TTS/video/embeddings/music) into what `opencode models` lists, and an
# unverified silent substitution is against this repo's discipline. model-map.yml itself
# is deliberately untouched and stays flexible on every tier (Zen's free catalog rotates;
# see that file's own header). If the default rotates out of Zen, pass another id at
# dispatch time or update the default here.
#
# PRIVACY CAVEAT (model chosen at dispatch): submitted data may train the upstream
# provider's models depending on the chosen model's own terms. These workflows must only
# ever operate on this already-public repo's own content -- never repoint them at
# proprietary code.
#
# No dedicated slash command exists for this loop (unlike /sefi:triage and /sefi:retro) --
# the prompt instructs the agent to follow loops/sync.loop.md directly rather than
# inventing a /sefi:sync command that isn't shipped.
name: sefi-sync-opencode

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Any provider/model id listed by 'opencode models'. Default is a free model verified live 2026-08-24."
        type: string
        default: opencode/muse-spark-1.2-contributor-free

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Gates only this workflow, not the scheduled Claude-based sync.yml run -- the
  # cross-runner S3 collision window described in the header still applies.
  group: sefi-sync-opencode
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Probe declared tools before the loop runs
        # requires-tools: git, rg. Deliberately minimal -- this loop targets whichever
        # package manager the project itself uses (npm outdated, pip list --outdated, ...)
        # opportunistically in Discovery, never a hardcoded one, so no manager-specific
        # tool belongs in this preflight.
        continue-on-error: true
        run: bash plugins/sefi-core/scripts/probe-tools.sh --loop loops/sync.loop.md

      - name: Install the headless agent CLI
        run: npm install -g opencode-ai

      - name: Write the Zen credential into the OpenCode auth file
        # No CLI/env-var contract for the Zen API key could be verified from primary
        # sources (state/plan-opencode-workflows.md step 3), so the credential is written
        # to OpenCode's own data dir at runtime instead. Path and JSON shape verified via
        # `opencode auth list` + `opencode debug paths` on 2026-08-23.
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${OPENCODE_ZEN_API_KEY:-}" ] || {
            echo "OPENCODE_ZEN_API_KEY is not set. Add it under Settings > Secrets > Actions." >&2
            exit 1
          }
          mkdir -p "$HOME/.local/share/opencode"
          cat > "$HOME/.local/share/opencode/auth.json" <<EOF
          {"opencode":{"type":"api","key":"${OPENCODE_ZEN_API_KEY}"}}
          EOF

      - name: Verify OpenCode sees the Zen credential
        # Fail fast, before any model call, if the auth file did not land.
        run: |
          set -euo pipefail
          opencode auth list | grep -qi "OpenCode Zen"

      - name: Run the sync loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          # Prompt content matches sync.yml byte for byte. Transport differs: sync.yml
          # pipes via stdin (live-verified for the Claude CLI); the live-verified
          # non-interactive form for `opencode run` (plan step 2) takes the message as an
          # argument, so it is built here and passed quoted.
          PROMPT="$(cat <<'EOF'
          Run the sync loop against this repository.
          Follow loops/sync.loop.md exactly, including its human checkpoint.
          This is the dependency-upkeep loop: Discovery finds outdated or
          vulnerable dependencies via whichever package manager this repo uses,
          if any -- skip that check rather than assume one, per the loop spec.
          EOF
          )"
          MODEL="${MODEL:-opencode/muse-spark-1.2-contributor-free}"
          case "$MODEL" in
            *[[:space:]]*|"") echo "MODEL must be a non-empty provider/model id (see opencode models)" >&2; exit 2 ;;
            */*) : ;;
            *) echo "MODEL must look like provider/model (see opencode models)" >&2; exit 2 ;;
          esac
          opencode run -m "$MODEL" --auto "$PROMPT"

      - name: Enforce budget caps
        if: always()
        run: bash plugins/sefi-core/scripts/budget-check.sh --scope run --spent 0

      - name: Commit state (never auto-merge)
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "sefi-sync[bot]"
          git config user.email "sefi-sync[bot]@users.noreply.github.com"
          if git diff --quiet -- state/ memory/ inbox/; then
            echo "no state changes to commit"
            exit 0
          fi
          BRANCH="sync/$(date +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git add state/ memory/ inbox/
          git commit -m "chore(sync): dependency-upkeep cycle $(date +%Y-%m-%d)"
          git push -u origin "$BRANCH"
          gh pr create --fill --base main --head "$BRANCH" \
            --title "sync: dependency-upkeep cycle $(date +%Y-%m-%d)" \
            --body "Automated sync cycle. Findings in \`state/sync.md\`. Never auto-merged -- a human reviews and merges."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
