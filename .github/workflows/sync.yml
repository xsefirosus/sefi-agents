# sefi-sync -- the sync loop (dependency upkeep), running against this repo.
#
# MANUAL DISPATCH ONLY. The Monday sync schedule runs through sync-opencode.yml, keeping
# a single scheduled runner for this loop and its state files. No dedicated slash command
# exists for this loop (unlike /sefi:triage and /sefi:retro).
name: sefi-sync

on:
  workflow_dispatch:
    inputs:
      allow_unmeasured_spend:
        description: "Explicit interactive waiver when local usage telemetry is unavailable"
        type: boolean
        default: false
      estimated_run_usd:
        description: "Maximum USD expected for this provider run; the preflight blocks runs that cannot fit the cap."
        type: string
        default: "0.50"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: sefi-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Probe declared tools before the loop runs
        # requires-tools: git, rg. Deliberately minimal -- this loop targets whichever
        # package manager the project itself uses (npm outdated, pip list --outdated, ...)
        # opportunistically in Discovery, never a hardcoded one, so no manager-specific
        # tool belongs in this preflight.
        continue-on-error: true
        run: bash plugins/sefi-core/scripts/probe-tools.sh --loop loops/sync.loop.md

      - name: Install the headless agent CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Preflight budget
        uses: ./.github/actions/preflight-budget
        with:
          estimated-run-usd: ${{ inputs.estimated_run_usd || '0.50' }}
          allow-unmeasured-spend: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unmeasured_spend }}

      - name: Run the sync loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${ANTHROPIC_API_KEY:-}" ] || {
            echo "ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets > Actions." >&2
            exit 1
          }
          {
            echo "Run the sync loop against this repository."
            echo "Follow loops/sync.loop.md exactly, including its human checkpoint."
            echo "This is the dependency-upkeep loop: Discovery finds outdated or"
            echo "vulnerable dependencies via whichever package manager this repo uses,"
            echo "if any -- skip that check rather than assume one, per the loop spec."
          } | claude --print --dangerously-skip-permissions --add-dir "$PWD"

      - name: Enforce budget caps
        if: always()
        env:
          ALLOW_UNMEASURED_SPEND: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unmeasured_spend }}
        run: |
          set -euo pipefail
          bash plugins/sefi-core/scripts/budget-check.sh --scope run || status=$?
          if [ "${status:-0}" -eq 3 ] && [ "${ALLOW_UNMEASURED_SPEND:-false}" = "true" ]; then
            echo "budget-check: explicit interactive waiver accepted for this run" >&2
            exit 0
          fi
          exit "${status:-0}"

      - name: Upload validated state candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-state
          path: |
            state/
            memory/
            inbox/
          if-no-files-found: ignore

  publish:
    needs: sync
    if: ${{ needs.sync.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sync-state
          path: .
      - uses: ./.github/actions/publish-state
        with:
          branch-prefix: sync
          commit-message: "chore(sync): dependency-upkeep cycle"
          title: "sync: dependency-upkeep cycle"
          body: "Automated sync cycle. Never auto-merged; a human reviews and merges."
          bot-name: sefi-sync[bot]
          bot-email: sefi-sync[bot]@users.noreply.github.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
