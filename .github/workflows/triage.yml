# sefi-morning-triage -- the morning-triage loop, running against this repo.
#
# MANUAL DISPATCH ONLY. The daily morning-triage run is scheduled through
# triage-opencode.yml at 06:00 UTC; this Claude-based workflow remains available for
# manual dispatch. Keeping the cron in one workflow avoids duplicate scheduled runners
# operating on the same loop and state/ files.
#
# This workflow has no `schedule:` trigger, so its dry-run default applies only to a
# manual `workflow_dispatch`.
name: sefi-morning-triage

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discovery only -- report findings, open no PR"
        type: boolean
        default: true
      allow_unmeasured_spend:
        description: "Explicit interactive waiver when local usage telemetry is unavailable"
        type: boolean
        default: false
      estimated_run_usd:
        description: "Maximum USD expected for this provider run; the preflight blocks runs that cannot fit the cap."
        type: string
        default: "0.50"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # A loop that claims work in state/ must not race itself. The claim protocol (v0.2.1)
  # commits before opening a worktree and uses push rejection as the arbiter, but not
  # starting a second run at all is cheaper than resolving the race.
  group: sefi-maintenance
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the Discovery move reads commits since the last run
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Probe declared tools before the loop runs
        # requires-tools: git, gh, rg. The probe checks each RUNS, not merely that it
        # exists. A BROKEN or MISSING tool means the loop proceeds at stated reduced scope
        # rather than reporting a clean cycle it could not perform. Non-blocking here:
        # `gh` is present on GitHub runners but unauthenticated until GH_TOKEN is set below,
        # and reduced scope is a valid outcome, not a build failure.
        continue-on-error: true
        run: bash plugins/sefi-core/scripts/probe-tools.sh --loop loops/morning-triage.loop.md

      - name: Install the headless agent CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Preflight budget
        uses: ./.github/actions/preflight-budget
        with:
          estimated-run-usd: ${{ inputs.estimated_run_usd || '0.50' }}
          allow-unmeasured-spend: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unmeasured_spend }}

      - name: Run the triage loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [ -n "${ANTHROPIC_API_KEY:-}" ] || {
            echo "ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets > Actions." >&2
            exit 1
          }
          # The prompt goes via stdin, never as an inline argument: harness-actions.md
          # records that Windows CLI argument-length limits break long inline prompts, and
          # stdin is the live-verified invocation for this CLI.
          {
            echo "Run /sefi:triage against this repository."
            echo "Follow loops/morning-triage.loop.md exactly, including its human checkpoint."
            if [ "${DRY_RUN}" = "true" ]; then
              echo "DRY RUN: perform Discovery and Persistence only. Write findings to state/triage.md. Open no PR and create no worktree."
            fi
          } | claude --print --dangerously-skip-permissions --add-dir "$PWD"

      - name: Enforce budget caps
        if: always()
        env:
          ALLOW_UNMEASURED_SPEND: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unmeasured_spend }}
        run: |
          set -euo pipefail
          bash plugins/sefi-core/scripts/budget-check.sh --scope run || status=$?
          if [ "${status:-0}" -eq 3 ] && [ "${ALLOW_UNMEASURED_SPEND:-false}" = "true" ]; then
            echo "budget-check: explicit interactive waiver accepted for this run" >&2
            exit 0
          fi
          exit "${status:-0}"

      - name: Upload validated state candidate
        if: ${{ success() && inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: triage-state
          path: |
            state/
            memory/
            inbox/
          if-no-files-found: ignore

  publish:
    needs: triage
    if: ${{ needs.triage.result == 'success' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download validated state candidate
        uses: actions/download-artifact@v4
        with:
          name: triage-state
          path: .
      - uses: ./.github/actions/publish-state
        with:
          branch-prefix: triage
          commit-message: "chore(triage): morning-triage cycle"
          title: "triage: morning-triage cycle"
          body: "Automated morning-triage cycle. Findings are in state/triage.md. A human reviews and merges the pull request."
          bot-name: "sefi-triage[bot]"
          bot-email: "sefi-triage[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
