# model-map.yml -- the ONE place a model identifier is written down.
#
# Agents declare a harness-neutral `tier:` (high / mid / low). This file maps each tier to
# a concrete model AND a reasoning effort for each harness. A new model, a renamed model,
# or a new harness is an edit HERE and nowhere else -- never a pass over 13 agent files.
#
# Read by: scripts/model-for.sh, scripts/install-opencode.sh, scripts/apply-model-map.sh,
# scripts/ci/validate-model-map.sh. Override with --model-map <path> on any installer.
#
# Keys per harness:
#   <tier>            the model identifier, OR the sentinel "flexible" (see below)
#   <tier>_reasoning  the reasoning effort for that tier ("none" where the harness has no
#                     such dial, or where <tier> is "flexible" -- see below). Effort scales
#                     with tier on purpose: the high tier is the adversarial judge and the
#                     long agent loop, which is exactly where more reasoning pays for itself.
#
# THE "flexible" SENTINEL. A harness whose provider's free-model catalog rotates (OpenCode
# Zen, and Hermes when it is pointed at the same Zen catalog) cannot have a specific free
# model id hardcoded here safely: deepseek-v4-flash-free was verified real on 2026-08-11 and
# confirmed retired from Zen entirely by 2026-08-21, ten days later. Hardcoding whatever is
# free THIS WEEK just means this file breaks again the next time the catalog turns over.
# "flexible" is a literal value (not empty, not a placeholder left unfinished) meaning: no
# model is written into that harness's installed agent files at all, so every agent falls
# back to whatever model the human has actually configured directly in that harness --
# install-opencode.sh's transform recognizes it and skips the `model:`/`options:` lines
# entirely (adapters/OPENCODE.md section 1 is where the human makes that choice). Point a
# tier at a real identifier instead the moment you want it pinned -- that is still a
# single-line edit here, same as always.
#
# WHY TIERS ARE NOT COSMETIC. The qa-engineer is `high` and the software-engineer it judges
# is `mid`. That gap IS generator/evaluator separation -- the first design principle in this
# repo. A harness that maps both tiers to one model keeps the separation in instructions
# only. validate-model-map.sh reports that as a WARNING, not an error, because on a
# single-model free window it is an honest constraint rather than a mistake.

claude-code:
  # Verified: native Claude Code tier aliases.
  # Claude Code exposes no per-agent reasoning dial, so reasoning is "none" here -- stated
  # rather than left blank, so a missing value is never mistaken for an unset one.
  high: opus
  mid: sonnet
  low: haiku
  high_reasoning: none
  mid_reasoning: none
  low_reasoning: none

codex:
  # Web-verified 2026-08-11. GPT-5.6 ships as a three-model family that maps 1:1 onto these
  # tiers: Sol is the flagship, Terra the balanced workhorse, Luna the fast/cheap option --
  # "Terra as default, Sol for the hard parts, Luna for volume". Using Sol for `high` is
  # what keeps the qa-engineer a genuinely stronger judge than the software-engineer.
  #
  # Use the explicit ids, never the bare `gpt-5.6` alias: that alias routes to gpt-5.6-sol
  # today and adds a routing question to any diagnostic.
  #
  # DEADLINE: gpt-5.4 and gpt-5.4-mini retire from Codex on 2026-08-31. The documented
  # replacements are gpt-5.4 -> gpt-5.6-terra and gpt-5.4-mini -> gpt-5.6-luna, so anything
  # still pinned to the 5.4/5.5 line needs moving before then.
  high: gpt-5.6-sol
  mid: gpt-5.6-terra
  low: gpt-5.6-luna
  # `model_reasoning_effort` accepts minimal|low|medium|high|xhigh.
  # CAVEAT: xhigh is only available on top-tier coding models (the codex-max tier). If a
  # dispatch on gpt-5.6-sol rejects or silently ignores xhigh, drop this one value to
  # "high" -- it is the single field to change, which is the point of this file.
  high_reasoning: xhigh
  mid_reasoning: high
  low_reasoning: medium

opencode:
  # deepseek-v4-flash-free was web-verified real on OpenCode Zen on 2026-08-11 (200K
  # context, 128K output, free tier, no card) and confirmed retired from Zen entirely by
  # 2026-08-21. That is the whole argument against hardcoding a free-catalog model here:
  # Zen's free lineup rotates (observed cycling through Big Pickle, MiniMax M2.5 Free, Mimo
  # V2 Pro/Omni Free, Nemotron 3 Super/Ultra Free, North Mini Code, and others), so any id
  # pinned here has an unknown, possibly short, shelf life. "flexible" (see the sentinel
  # note above) hands the choice to the human instead: pick a model in OpenCode Zen
  # yourself (adapters/OPENCODE.md section 1, `/models` in OpenCode lists what is current
  # right now) and every agent inherits it via OpenCode's own session-model fallback --
  # install-opencode.sh writes no `model:` line at all when a tier resolves to "flexible".
  #
  # This does still cost generator/evaluator separation on this harness (the qa-engineer
  # and the software-engineer both inherit the one model you picked) -- the same cost a
  # single shared free model already paid here, just now honestly a consequence of your own
  # choice rather than an id this file silently prescribed. Naming two DIFFERENT real
  # identifiers on high/mid restores a real adversary and is still a single-line edit here.
  high: flexible
  mid: flexible
  low: flexible
  # Left "none": a hardcoded reasoning_effort value (DeepSeek V4 Flash's own dial accepted
  # high/max) is meaningless, or may be rejected, on whatever model the human actually
  # picks. Tune options.reasoningEffort yourself in the installed agent file if your chosen
  # model supports the field and you want the high tier to reason harder.
  high_reasoning: none
  mid_reasoning: none
  low_reasoning: none

hermes:
  # Same rotating-free-catalog problem as opencode above, and the same fix: "flexible"
  # instead of a pinned id. Hermes already takes its model from a global
  # `provider.model` setting the human sets directly (`hermes config set provider.model
  # <your-choice>`, adapters/HERMES.md) and treats per-agent `model:` as advisory, so this
  # was already the least-hardcoded harness -- the map's job here is just to stop
  # `scripts/model-for.sh hermes <tier>` from handing back a model id that might already be
  # dead by the time it's read.
  high: flexible
  mid: flexible
  low: flexible
  high_reasoning: none
  mid_reasoning: none
  low_reasoning: none
