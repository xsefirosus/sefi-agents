# model-map.yml -- the ONE place a model identifier is written down.
#
# Agents declare a harness-neutral `tier:` (high / mid / low). This file maps each tier to
# a concrete model for each harness. A new model, a renamed model, or a new harness is an
# edit HERE and nowhere else -- never a pass over 13 agent files.
#
# Read by: scripts/model-for.sh, scripts/install-opencode.sh, scripts/install-hermes.sh,
# scripts/ci/validate-model-map.sh. Override the whole file with --model-map <path> on any
# installer, or edit it in place; it is yours.
#
# PROVENANCE OF THESE IDENTIFIERS. The claude-code row is verified -- those are the tier
# aliases Claude Code itself accepts. The codex and opencode/hermes rows are USER-SUPPLIED
# and were written down exactly as given; they have not been checked against any provider's
# API from this repo, and this repo has no way to check them offline. If a dispatch fails
# with a model-not-found error, the identifier here is the first thing to correct -- that
# is a one-line fix by construction. Marking them unverified rather than implying they are
# confirmed is the anti-hallucination rule applied to config.
#
# WHY TIERS ARE NOT COSMETIC. The qa-engineer is `high` and the software-engineer is `mid`
# on purpose: the routing table's "different model where possible" and the generator/
# evaluator split are the repo's first design principle. When a harness maps two tiers to
# the SAME identifier, that separation degrades to instructions-only -- still real, but
# weaker than a genuinely different judge. validate-model-map.sh reports that as a warning,
# not an error, because on a single-model harness it is an honest constraint rather than a
# mistake. Give `high` a stronger model than `mid` wherever the harness has one.

# tier -> model identifier, per harness.

claude-code:
  # Verified: native Claude Code tier aliases.
  high: opus
  mid: sonnet
  low: haiku

codex:
  # USER-SUPPLIED, unverified from this repo. Codex installs via the plugin marketplace,
  # which reads agent files directly with no transform step -- so nothing rewrites `model:`
  # for Codex automatically. adapters/CODEX.md section 2 states `model:` is advisory there.
  # To bake these in anyway, run `scripts/apply-model-map.sh codex <src> <dst>`.
  high: 5.6-terra
  mid: 5.6-luna
  low: 5.5-gpt

opencode:
  # USER-SUPPLIED, unverified from this repo. All three tiers currently resolve to one
  # model, which collapses generator/evaluator separation to instructions-only. Point
  # `high` at a stronger model as soon as one is available on this harness.
  high: deepseek-v4-flash
  mid: deepseek-v4-flash
  low: deepseek-v4-flash

hermes:
  # `deepseek-v4-flash-free` is this repo's own documented Hermes model
  # (adapters/HERMES.md section 1, set globally via `hermes config set provider.model`),
  # so it is used here in preference to a shortened name. Hermes takes its model from that
  # global setting and treats per-agent `model:` as advisory (HERMES.md section 4), so
  # these values are consumed at DISPATCH time -- resolve a tier with
  # `scripts/model-for.sh hermes <tier>` and pass it in the delegate_task payload.
  high: deepseek-v4-flash-free
  mid: deepseek-v4-flash-free
  low: deepseek-v4-flash-free
