# billing_mode is OPTIONAL. When absent, budget-check.sh resolves a per-harness
# default: opencode and hermes resolve free, codex and claude-code resolve flat
# (from --harness, $SEFI_HARNESS, or the machine-local .sefi/harness marker written
# by /sefi:init; an unknown harness stays metered, fail-closed). An explicit value
# always wins. Uncomment to opt in -- e.g. metered on usage-based billing:
# billing_mode: free   # allowed: metered, flat, free. See docs/BUDGET.md.
# Non-dollar discipline (max_retries, per_agent_return_tokens,
# max_parallel_worktrees, minimization) stays always on --
# see docs/BUDGET.md.
per_run_usd_cap: 0.50
daily_usd_cap: 2.00
per_dispatch_usd_cap: 0.15   # one subagent dispatch; catches a runaway dispatch long before the daily cap notices (a predecessor system: one self-batching dispatch hit 1.36M tokens)
max_retries: 2   # total REJECT cycles allowed on the same slice before escalating to inbox/
                 # (max_retries: 2 = escalate after the 2nd REJECT, not the 3rd)
max_parallel_worktrees: 3
per_agent_return_tokens: 200   # hard cap -- check-reply.sh rejects and forces a redo above
                                # this. Live data showed qa-engineer's verdict-with-evidence
                                # replies twice landed at 162 and 172 words, both real, both
                                # forced through a redo against the old 150 cap -- not
                                # rambling, just the shape of a PASS/REJECT call that has to
                                # cite file:line evidence.
per_agent_return_tokens_target: 150   # soft target -- check-reply.sh notes (does not block)
                                       # a reply that clears this but stays within the hard
                                       # cap above. Every agent should aim here first; 200 is
                                       # the ceiling for when the job genuinely needs more,
                                       # not the default to write toward.
benchmark_per_run_usd_cap: 15.00   # operator-tracked ceiling for ONE run of the blinded
                                    # paired A/B benchmark (docs/BUDGET.md, benchmarks/).
                                    # NOT enforced by budget-check.sh and NOT in any scope
                                    # it checks; nothing in the repo blocks a benchmark run
                                    # that exceeds it yet. Verified after the fact from the
                                    # summed trial cost_usd on the scorecard.
